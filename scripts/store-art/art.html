<!doctype html>
<!-- Header (3840 × 1646) and search results (3840 × 2560) image of the iOS app's product page,
     rendered by render.sh. Placeholders: {{W}} {{H}} {{LINE}} {{SHOTS}} (dist/store, absolute)
     {{LANG}}. Text and screens stay in the middle, where both crops keep them. -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #111015; --text: #F3F2F7; --accent: #6C65F0; --accent-light: #B7B3FF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  /* The app's night landscape: a glow, a moon and layered hills. */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 60% at 50% 18%, rgba(108, 101, 240, 0.42), transparent 70%),
      radial-gradient(ellipse 40% 45% at 22% 90%, rgba(46, 107, 230, 0.22), transparent 70%),
      radial-gradient(ellipse 40% 45% at 80% 92%, rgba(183, 179, 255, 0.16), transparent 70%),
      var(--bg);
  }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; }
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: calc({{H}}px * 0.075);
  }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .brand span { font-size: 92px; font-weight: 700; letter-spacing: -1px; }
  h1 {
    margin-top: 42px;
    font-size: 150px; font-weight: 800; letter-spacing: -3px; line-height: 1.05;
    text-align: center; max-width: 2900px;
    text-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
  }
  .devices { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 70px; margin-top: 70px; }
  .device {
    background: #050507; padding: 18px; border-radius: 88px;
    box-shadow: 0 50px 140px rgba(0, 0, 0, 0.65), 0 0 0 3px rgba(255, 255, 255, 0.16);
  }
  .device img { display: block; border-radius: 72px; }
  .device.pad { border-radius: 60px; }
  .device.pad img { border-radius: 44px; }
  /* Header: short; screens are cut off by the bottom edge, as if they rise into the picture. */
  .header .brand { display: none; }
  .header h1 { font-size: 132px; margin-top: 0; }
  .header .devices { margin-top: 64px; }
  .header .phone img { height: 1300px; }
  .header .pad img { height: 1300px; }
  .search .phone img { height: 1560px; }
  .search .pad img { height: 1560px; }
</style>
</head>
<body class="{{KIND}}">
  <div class="sky"></div>
  <svg class="hills" viewBox="0 0 1600 400" preserveAspectRatio="none">
    <path d="M0 220 C 200 140 380 230 560 170 C 760 100 940 200 1120 150 C 1300 100 1460 170 1600 140 L1600 400 L0 400 Z" fill="#1A1838"/>
    <path d="M0 280 C 240 210 420 300 640 240 C 860 180 1040 280 1260 230 C 1420 195 1520 240 1600 225 L1600 400 L0 400 Z" fill="#15142B"/>
    <path d="M0 340 C 260 290 520 360 800 320 C 1080 280 1340 350 1600 315 L1600 400 L0 400 Z" fill="#111020"/>
  </svg>
  <div class="stage">
    <div class="brand"><img src="{{ICON}}" alt=""><span>Fernsy</span></div>
    <h1>{{LINE}}</h1>
    <div class="devices">
      <div class="device phone"><img src="{{SHOTS}}/iphone/{{LANG}}/01-start.png" alt=""></div>
      <div class="device pad"><img src="{{SHOTS}}/ipad/{{LANG}}/02-guide.png" alt=""></div>
      <div class="device phone"><img src="{{SHOTS}}/iphone/{{LANG}}/04-film.png" alt=""></div>
    </div>
  </div>
</body>
</html>
