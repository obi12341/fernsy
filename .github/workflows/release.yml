# Builds Fernsy outside the user's Mac (see DEVELOPMENT.md › Release).
#   tag vX.Y / vX.Y.Z on main → release "Fernsy X.Y" with the notarized DMG, and the App Store
#                               build uploaded to App Store Connect (submitting stays manual)
#   every night (main changed) → the notarized DMG on the rolling pre-release "Nightly"
#   run manually               → channel "nightly" (default) or "appstore-test" (archive and
#                               export the App Store build without uploading)
# Every channel first runs the tests (tests.yml); nothing is built when they fail.
# The version comes from the tag (nightly: the newest release tag), the build number from
# the commit count; the project file is never changed. Signing data comes only from secrets.
name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: What to build
        type: choice
        options: [nightly, appstore-test]
        default: nightly

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.channel || github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          SHA="$GITHUB_SHA"
          git fetch -q origin main --tags --force
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CHANNEL=release
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y or vX.Y.Z"; exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
          else
            CHANNEL="${INPUT_CHANNEL:-nightly}"
            if [ "$CHANNEL" = "nightly" ]; then
              # Not a release: the version names the commit date, never a release number.
              VERSION="nightly-$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d "$SHA")"
            else
              LAST=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$SHA" 2>/dev/null || true)
              if [ -n "$LAST" ]; then VERSION="${LAST#v}"; else
                VERSION=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' Fernsy.xcodeproj/project.pbxproj | cut -d' ' -f3)
              fi
            fi
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              NIGHTLY=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
              if [ "$NIGHTLY" = "$SHA" ]; then
                echo "main has not changed since the last nightly ($SHA)"; CHANNEL=skip
              fi
            fi
          fi
          BUILD=$(git rev-list --count "$SHA")
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Fernsy $VERSION ($BUILD) · $CHANNEL · $SHA"

  # Nothing is built or published from a commit whose tests fail.
  tests:
    needs: prepare
    if: needs.prepare.outputs.channel != 'skip'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  dmg:
    needs: [prepare, tests]
    if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'nightly'
    # macOS 27 image with Xcode 27 (public preview); macos-26 only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # Secrets go only to the steps that need them, never to third-party actions.
      - name: Check secrets
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see DEVELOPMENT.md › Release)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'   # the release Xcode the app is built with locally; not a beta
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION (Fernsy targets macOS 27). Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      # Saved right away, so a later failing step does not throw the build away.
      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate in DEVELOPER_ID_P12 is not a \"Developer ID Application\" identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: scripts/build-dmg.sh

      - name: Verify
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          DMG="dist/Fernsy-$VERSION.dmg"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          MOUNT=$(hdiutil attach -nobrowse -readonly "$DMG" | grep -o '/Volumes/.*' | head -1)
          codesign --verify --deep --strict "$MOUNT/Fernsy.app"
          codesign -dv "$MOUNT/Fernsy.app" 2>&1 | grep -q 'flags=.*runtime'
          spctl -a -t exec -v "$MOUNT/Fernsy.app"
          PLIST="$MOUNT/Fernsy.app/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")" = "$VERSION" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")" = "$BUILD" ]
          hdiutil detach "$MOUNT"
          mkdir -p out
          if [ "$CHANNEL" = "nightly" ]; then
            cp "$DMG" out/Fernsy-Nightly.dmg
          else
            cp "$DMG" out/Fernsy.dmg
            cp "$DMG" "out/Fernsy-$VERSION.dmg"
          fi

      # Release notes from the Release-Note-de/-en commit trailers (scripts/release-notes.sh);
      # they travel to the publish job in the artifact.
      - name: Release notes
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: scripts/release-notes.sh "$CHANNEL" "$SHA" out/notes

      # Sparkle feed for the in-app updater of the DMG build. generate_appcast only signs the
      # DMG when the app's SUPublicEDKey matches the private key, which is checked here.
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: '2.10.0'   # same as the Swift package
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: no appcast.xml, the in-app updater finds nothing (DEVELOPMENT.md › Updates)"
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          if [ "$CHANNEL" = "nightly" ]; then
            TAG=nightly; NAME=Fernsy-Nightly.dmg
          else
            TAG="$GITHUB_REF_NAME"; NAME="Fernsy-$VERSION.dmg"
          fi
          FEED="$RUNNER_TEMP/feed"
          mkdir -p "$FEED"
          cp "out/$NAME" "$FEED/"
          # Short notes for Sparkle's window; the full text is on the release page. German goes
          # through generate_appcast, English is added afterwards (scripts/appcast-notes.py).
          html() {
            echo "<ul>"
            head -30 "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's#.*#<li>&</li>#'
            echo "</ul>"
          }
          html out/notes/notes-de.txt > "$FEED/${NAME%.dmg}.html"
          html out/notes/notes-en.txt > "$RUNNER_TEMP/notes-en.html"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/obi12341/fernsy/releases/download/$TAG/" \
            --full-release-notes-url "https://github.com/obi12341/fernsy/releases/tag/$TAG" \
            --embed-release-notes -o out/appcast.xml "$FEED"
          if ! grep -q 'sparkle:edSignature=' out/appcast.xml; then
            echo "::error::The appcast is unsigned: SUPublicEDKey in the app does not match SPARKLE_ED_PRIVATE_KEY"
            exit 1
          fi
          python3 scripts/appcast-notes.py out/appcast.xml "$RUNNER_TEMP/notes-en.html"
          grep -o '<sparkle:version>[^<]*\|<sparkle:shortVersionString>[^<]*\|enclosure url="[^"]*"' out/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: out/
          retention-days: 7

      - name: Clean up signing data
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

  appstore:
    needs: [prepare, tests]
    if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'appstore-test'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=()
          for name in NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see DEVELOPMENT.md › Release)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      # Apple's cloud signing through the API key (Admin role): no certificates or profiles
      # to import; Xcode fetches the App Store profile and signs with the cloud-managed
      # distribution certificate.
      - name: Archive and upload (or export for a test)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          ASC_KEY="$RUNNER_TEMP/asc-key.p8"
          # umask only for the key file: a step-wide 077 made every built file owner-only, and
          # App Store Connect rejects packages with files only root can read.
          (umask 077; echo "$NOTARY_KEY_P8" | base64 --decode > "$ASC_KEY")
          export ASC_KEY
          if [ "$CHANNEL" = "release" ]; then export UPLOAD=1; fi
          scripts/build-appstore.sh
          if [ "$CHANNEL" != "release" ]; then
            PKG=$(ls build/appstore/export/*.pkg)
            pkgutil --check-signature "$PKG"
          fi

      - name: Clean up the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"

  publish:
    needs: [prepare, dmg, appstore]
    # A release needs the App Store upload too; a nightly has no App Store job.
    if: >-
      always() && needs.dmg.result == 'success' &&
      (needs.prepare.outputs.channel == 'nightly' ||
       (needs.prepare.outputs.channel == 'release' && needs.appstore.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dmg
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          APPCAST=""
          [ -f out/appcast.xml ] && APPCAST=out/appcast.xml
          if [ "$CHANNEL" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
            if gh release view "$TAG" > /dev/null 2>&1; then
              # Created by hand in the web interface: keep its title and text.
              gh release upload "$TAG" out/Fernsy.dmg "out/Fernsy-$VERSION.dmg" $APPCAST --clobber
            else
              # Notes from the commit trailers (dmg job, scripts/release-notes.sh).
              NOTES="$RUNNER_TEMP/notes.md"
              {
                echo "## Neu in Fernsy $VERSION"
                echo
                sed 's/^/- /' out/notes/notes-de.txt
                echo
                echo "## What's new"
                echo
                sed 's/^/- /' out/notes/notes-en.txt
              } > "$NOTES"
              gh release create "$TAG" --title "Fernsy $VERSION" --notes-file "$NOTES" --latest \
                out/Fernsy.dmg "out/Fernsy-$VERSION.dmg" $APPCAST
            fi
          else
            LAST=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$SHA" 2>/dev/null || true)
            NOTES="$RUNNER_TEMP/nightly.md"
            {
              echo "Test build of \`main\` at $(git log -1 --format='%h, %cd' --date=format:'%Y-%m-%d %H:%M UTC' "$SHA")."
              echo "Installs over Fernsy and uses the same data."
              echo
              # Trailer notes on top when the commits have some; testers also get every commit.
              if [ ! -f out/notes/notes-de.fallback ] && [ -s out/notes/notes-de.txt ]; then
                echo "## Neu"
                echo
                sed 's/^/- /' out/notes/notes-de.txt
                echo
              fi
              if [ ! -f out/notes/notes-en.fallback ] && [ -s out/notes/notes-en.txt ]; then
                echo "## What's new"
                echo
                sed 's/^/- /' out/notes/notes-en.txt
                echo
              fi
              echo "Changes since ${LAST:-the beginning}:"
              echo
              git log --format='- %s (%h)' "${LAST:+$LAST..}$SHA" | head -60
            } > "$NOTES"
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            gh release create nightly --prerelease --latest=false --target "$SHA" \
              --title "Fernsy Nightly ${VERSION#nightly-} (build $BUILD)" --notes-file "$NOTES" out/Fernsy-Nightly.dmg $APPCAST
          fi
