# Runs the FernsyCore tests (see DEVELOPMENT.md › Tests and FernsyCore): on macOS, and on a tvOS
# simulator after building the package for tvOS. Builds the Apple TV app with FFmpeg and runs its
# UI test against the demo server (DEVELOPMENT.md › Apple TV). On pushes to main (not for commits that
# change only specs and docs), on pull requests, and from release.yml before anything is built or
# published, unless a run of this workflow already passed for that commit (ci-test-runs). Change
# branches are tested locally in full before they are pushed and merged.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['openspec/**', '**/*.md']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: macOS tests and tvOS build
        run: scripts/test.sh

      - name: tvOS simulator runtime
        run: |
          if ! xcrun simctl list devices available | grep -q 'Apple TV'; then
            xcodebuild -downloadPlatform tvOS
          fi
          xcrun simctl list devices available | grep 'Apple TV'

      - name: Tests on a tvOS simulator
        run: scripts/test.sh --tvos-sim

  apple-tv:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The same cache as release.yml: all three slices, keyed by the build script.
      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Apple TV simulator
        run: |
          if ! xcrun simctl list runtimes | grep -q 'tvOS 27'; then
            xcodebuild -downloadPlatform tvOS
          fi
          if ! xcrun simctl list devices available | grep -q 'Apple TV 4K (3rd generation) ('; then
            RUNTIME="$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.tvOS-27[-0-9]*' | tail -1)"
            xcrun simctl create "Apple TV 4K (3rd generation)" \
              com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K "$RUNTIME"
          fi
          xcrun simctl list devices available | grep 'Apple TV'

      - name: Apple TV app and UI test
        # FERNSY_CI in the test runner: tests skip judgments a GPU-less runner cannot meet.
        env:
          TEST_RUNNER_FERNSY_CI: '1'
        run: scripts/tv-uitest.sh

      # The result bundle (failure messages with the element tree, screenshots, the screen
      # recording and the app log) for a failing UI test; the log shows only the first lines.
      - name: Upload the UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-tv-uitest-results
          path: build/tv/Logs/uitest-*.xcresult
          retention-days: 7
