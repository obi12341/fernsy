# Four jobs, one per part (ci-job-names): `core` runs the Fernsy Cloud worker tests and the
# FernsyCore tests (see DEVELOPMENT.md › Tests and FernsyCore) on macOS, and on a tvOS simulator after building the package for tvOS;
# `linux` runs the FernsyShared and Fernsy Server tests on Linux, amd64 and arm64 (headless-recorder);
# `apple-tv` builds the Apple TV app with FFmpeg and runs its UI tests against the demo server,
# split into 3 parallel parts (DEVELOPMENT.md › Apple TV); `ios` builds the iPhone and iPad app for the iOS simulator
# (DEVELOPMENT.md › iPhone and iPad). On pushes to main (not for commits that
# change only specs and docs), on pull requests, and from release.yml before anything is built or
# published, unless a run of this workflow already passed for that commit (ci-test-runs). Change
# branches are tested locally in full before they are pushed and merged.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['openspec/**', '**/*.md']
  pull_request:
  # By hand, e.g. to measure the UI test times of a branch (faster-ui-tests).
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  core:
    name: FernsyCore tests (macOS, tvOS)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Worker tests, macOS tests and tvOS build
        run: scripts/test.sh

      - name: tvOS simulator runtime
        run: |
          if ! xcrun simctl list devices available | grep -q 'Apple TV'; then
            xcodebuild -downloadPlatform tvOS
          fi
          xcrun simctl list devices available | grep 'Apple TV'

      - name: Tests on a tvOS simulator
        run: scripts/test.sh --tvos-sim

  # The UI tests in 3 parts on 3 runners (tvos-uitest-shards): tv-uitest.sh assigns every test class
  # to one part; a failing part does not cancel the others, so a run shows every failure.
  linux:
    name: FernsyShared tests (Linux ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: FernsyShared tests
        working-directory: Packages/FernsyCore
        run: swift test

      - name: Fernsy Server tests
        working-directory: server
        run: swift test

  apple-tv:
    name: Apple TV app and UI test (${{ matrix.shard }}/3)
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The same cache as release.yml: all slices, keyed by the build script.
      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      # Every part builds FFmpeg on a miss, one saves it: two saves of one key race.
      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Apple TV simulator
        run: |
          if ! xcrun simctl list runtimes | grep -q 'tvOS 27'; then
            xcodebuild -downloadPlatform tvOS
          fi
          # The runner image has each runtime twice: a classic disk image under
          # /Library/Developer/CoreSimulator/Volumes and a cryptex variant. simdiskimaged prefers
          # the cryptex one and ejects the classic image about 7.5 min later - with the booted
          # simulator on it, which then shuts down mid-test (fix/tv-ci-duplicate-runtimes). Eject
          # the classic copies before booting, so the simulator runs from the cryptex variant.
          for volume in /Library/Developer/CoreSimulator/Volumes/*/; do
            [ -d "$volume" ] || continue
            echo "Ejecting duplicate runtime image $volume"
            sudo diskutil unmount force "$volume" || true
          done
          for _ in $(seq 1 30); do
            xcrun simctl list runtimes | grep 'tvOS 27' | grep -vq unavailable && break
            sleep 2
          done
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep 'tvOS 27' | grep -vq unavailable; then
            echo "::error::No tvOS 27 runtime after ejecting the duplicate runtime images"
            exit 1
          fi
          if ! xcrun simctl list devices available | grep -q 'Apple TV 4K (3rd generation) ('; then
            RUNTIME="$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.tvOS-27[-0-9]*' | tail -1)"
            xcrun simctl create "Apple TV 4K (3rd generation)" \
              com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K "$RUNTIME"
          fi
          xcrun simctl list devices available | grep 'Apple TV'

      - name: Apple TV app and UI test
        # FERNSY_CI in the test runner: tests skip judgments a GPU-less runner cannot meet.
        env:
          TEST_RUNNER_FERNSY_CI: '1'
        run: scripts/tv-uitest.sh --shard ${{ matrix.shard }}/3

      # Every test's duration (faster-ui-tests): in the job summary, and kept as a small file to
      # compare runs (scripts/uitest-times.sh).
      - name: UI test times
        if: always()
        run: |
          shopt -s nullglob
          bundles=(build/tv/Logs/uitest-*.xcresult)
          [ ${#bundles[@]} -gt 0 ] || exit 0
          scripts/uitest-times.sh --csv "${bundles[@]}" > "uitest-times-${{ matrix.shard }}.csv" || true
          { echo '```'; scripts/uitest-times.sh "${bundles[@]}" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the UI test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-tv-uitest-times-${{ matrix.shard }}
          path: uitest-times-${{ matrix.shard }}.csv
          if-no-files-found: ignore
          retention-days: 30

      # The app's own logs, one per launch (IPTV_LOGARCHIVE): a test stopped after its time limit
      # leaves no result attachment, but its launch log shows where the app was and whether the
      # main thread was blocked (IPTV_HANGWATCH; fix/tv-ci-hang-diagnostics).
      - name: Collect the app logs
        if: failure()
        run: |
          # From the simulators' data folders: xcodebuild shuts the simulator down after the run.
          mkdir -p app-logs
          n=0
          while IFS= read -r logs; do
            n=$((n + 1))
            cp -R "$logs" "app-logs/$n"
          done < <(find ~/Library/Developer/CoreSimulator/Devices -maxdepth 10 -type d -path '*/Library/Caches/Fernsy/logs' 2>/dev/null)
          grep -rh "main thread\|audio session" app-logs || true
          # Crash reports of the app and the test runner, and each simulator's system log: who
          # ended a test after about 60 s (a crash, runningboardd, XCTest), and what the runner
          # did meanwhile (fix/tv-ci-crash-logs).
          mkdir -p app-logs/crashes
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -newermt '-2 hours' \( -iname '*fernsy*' -o -iname '*runner*' \) \
            -exec cp {} app-logs/crashes/ \; 2>/dev/null || true
          ls app-logs/crashes
          for dir in ~/Library/Developer/CoreSimulator/Devices/*/; do
            device="$(basename "$dir")"
            [ -n "$(find "$dir/data/Containers/Data/Application" -maxdepth 4 -type d -path '*/Library/Caches/Fernsy' 2>/dev/null | head -1)" ] || continue
            xcrun simctl boot "$device" 2>/dev/null || true
            xcrun simctl spawn "$device" log show --last 90m --style compact \
              --predicate 'process CONTAINS "Fernsy" OR eventMessage CONTAINS[c] "de.mobilistics.fernsy"' \
              > "app-logs/system-$device.log" 2>&1 || true
            grep -iE "termination request|terminat.*fernsy|crash|jetsam|signal" "app-logs/system-$device.log" | tail -40 || true
            # The simulator's own system processes and every error or fault: what made
            # launchd_sim exit (a watchdog, a crashed system service).
            xcrun simctl spawn "$device" log show --last 90m --style compact \
              --predicate 'process IN {"launchd_sim", "PineBoard", "HeadBoard", "backboardd", "watchdogd", "runningboardd", "CoreSimulatorBridge", "testmanagerd"} OR messageType == fault OR (messageType == error AND NOT process CONTAINS "Fernsy")' \
              > "app-logs/simulator-system-$device.log" 2>&1 || true
            grep -iE "watchdog|shutdown|reboot|exiting|crash|fault" "app-logs/simulator-system-$device.log" | tail -40 || true
          done
          # The simulator itself was shut down and booted again mid-test (launchd_sim, PineBoard
          # restarted); who asked for it is in the host's CoreSimulator logs.
          tail -n 20000 ~/Library/Logs/CoreSimulator/CoreSimulator.log > app-logs/CoreSimulator.log 2>/dev/null || true
          /usr/bin/log show --last 90m --style compact \
            --predicate 'subsystem BEGINSWITH "com.apple.CoreSimulator" OR process BEGINSWITH "CoreSimulator" OR process == "simctl" OR process == "xcodebuild"' \
            > app-logs/host-coresimulator.log 2>&1 || true
          # The simulator shuts down about 7.5 min after it boots, without a request from
          # xcodebuild or CoreSimulator. The tvOS runtime runs from a mounted disk image: the
          # services that mount and check it, and the mounts now (fix/tv-ci-runtime-image-logs).
          /usr/bin/log show --last 90m --style compact \
            --predicate 'process IN {"simdiskimaged", "cryptexd", "diskimagesiod", "diskarbitrationd", "mobileassetd", "launchd"} OR subsystem BEGINSWITH "com.apple.security.cryptex" OR subsystem BEGINSWITH "com.apple.DiskImages"' \
            > app-logs/host-runtime-images.log 2>&1 || true
          { mount | grep -iE "simruntime|cryptex|tvOS" ; echo; xcrun simctl runtime list; } > app-logs/runtime-mounts.txt 2>&1 || true
          grep -iE "unmount|mount|eject|detach|tvOS_|simruntime" app-logs/host-runtime-images.log | tail -40 || true
          grep -ihE "shutdown|shutting down|reboot|boot|kill|terminat|memory|jetsam|crash" app-logs/CoreSimulator.log app-logs/host-coresimulator.log | tail -60 || true
      - name: Upload the app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-tv-app-logs-${{ matrix.shard }}
          path: app-logs
          if-no-files-found: ignore
          retention-days: 14

      # The result bundle (failure messages with the element tree, screenshots, the screen
      # recording and the app log) for a failing UI test; the log shows only the first lines.
      - name: Upload the UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-tv-uitest-results-${{ matrix.shard }}
          path: build/tv/Logs/uitest-*.xcresult
          retention-days: 7

  ios:
    name: iPhone and iPad app
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        env:
          XCODE_VERSION: '27.1'
        run: |
          XCODE="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::This runner has no Xcode $XCODE_VERSION. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The same cache as release.yml; only apple-tv saves it on a miss (two saves of one key race).
      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Packages/FernsyPlayer/Frameworks
            Packages/FernsyPlayer/Sources/CFFShim/include/lib*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh

      # Build only (UI tests run locally): a shared FernsyTV file that breaks the iOS target fails here.
      - name: iPhone and iPad app build
        run: |
          xcodebuild -project Fernsy.xcodeproj -scheme "Fernsy iOS" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build -quiet
